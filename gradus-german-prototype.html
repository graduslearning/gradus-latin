<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE">
<title>Gradus German: Vocab Master – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1838; --ink2:rgba(30,24,56,.64); --ink3:rgba(30,24,56,.40);
  --gold:#F2B53A; --gold-ink:#2E1D02; --violet:#6B4EE6; --violet-soft:rgba(107,78,230,.12);
  --ok:#17A866; --bad:#E5484D;
  --glass:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.56));
  --stroke:rgba(255,255,255,.95); --hair:rgba(30,24,56,.08);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 32px rgba(70,48,140,.13),0 1px 3px rgba(70,48,140,.08);
  --r-card:26px; --r-row:18px;
  --roman:"Cormorant Garamond",Georgia,serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
:root{--bg:#E4EEFA;--bgimg:radial-gradient(70% 45% at 0% 0%,#B8D3F5 0%,transparent 72%),radial-gradient(55% 40% at 100% 30%,#C9E6F2 0%,transparent 72%),radial-gradient(80% 50% at 40% 100%,#CFDDF7 0%,transparent 72%)}
.t-sky{--bg:#E4EEFA;--bgimg:radial-gradient(70% 45% at 0% 0%,#B8D3F5 0%,transparent 72%),radial-gradient(55% 40% at 100% 30%,#C9E6F2 0%,transparent 72%),radial-gradient(80% 50% at 40% 100%,#CFDDF7 0%,transparent 72%)}
.t-sage{--bg:#E6EEE3;--bgimg:radial-gradient(70% 45% at 0% 0%,#C3DCBB 0%,transparent 72%),radial-gradient(55% 40% at 100% 30%,#DCE8C9 0%,transparent 72%),radial-gradient(80% 50% at 40% 100%,#C9E0D6 0%,transparent 72%)}
.t-dusk{--bg:#EEE8F6;--bgimg:radial-gradient(70% 45% at 0% 0%,#D3C3F2 0%,transparent 72%),radial-gradient(55% 40% at 100% 30%,#F4CFDC 0%,transparent 72%),radial-gradient(80% 50% at 40% 100%,#CCCBF2 0%,transparent 72%)}
.t-sunrise{--bg:#FBF0E6;--bgimg:radial-gradient(70% 45% at 0% 0%,#FBD9BC 0%,transparent 72%),radial-gradient(55% 40% at 100% 30%,#F9E6B8 0%,transparent 72%),radial-gradient(80% 50% at 40% 100%,#F6CFC6 0%,transparent 72%)}
.t-plain{--bg:#F2F3F5;--bgimg:linear-gradient(#F2F3F5,#F2F3F5)}
.t-original{--bg:#F2EFFB;--bgimg:radial-gradient(55% 40% at 0% 0%,#DCD2FF 0%,transparent 70%),radial-gradient(50% 38% at 100% 22%,#CDEFE4 0%,transparent 70%),radial-gradient(60% 45% at 25% 100%,#FFE0CF 0%,transparent 70%),radial-gradient(45% 35% at 100% 90%,#E3DBFF 0%,transparent 70%)}
/* Classic: ink-navy and antique gold on stone paper, solid cards, serif headings */
.t-classic{--bg:#F3F2EE;--bgimg:radial-gradient(90% 55% at 50% -10%,#FFFFFF 0%,transparent 70%),linear-gradient(180deg,#F6F5F1,#EFEEE9);
  --ink:#14213D;--ink2:rgba(20,33,61,.66);--ink3:rgba(20,33,61,.40);--violet:#1C3557;--violet-soft:rgba(28,53,87,.08);
  --gold:#B08D3C;--gold-ink:#FFFFFF;--hair:rgba(20,33,61,.09);
  --glass:#FFFFFF;--stroke:rgba(20,33,61,.08);--shadow:0 1px 2px rgba(20,33,61,.05),0 10px 30px rgba(20,33,61,.06);--serif:"Cormorant Garamond",Georgia,serif}
body.t-classic .glass{-webkit-backdrop-filter:none;backdrop-filter:none}
body.t-classic h1{font-family:var(--serif);font-weight:600;font-size:42px;letter-spacing:-.01em}
body.t-classic .tile h2,body.t-classic .shead b,body.t-classic .score .big,body.t-classic .hist h3{font-family:var(--serif);font-weight:700;letter-spacing:0;font-size:21px}
body.t-classic .tile.lead h2{font-size:28px}
body.t-classic .tile.lead{background:#fff;border:1px solid rgba(176,141,60,.5)}
body.t-classic .primary{background:var(--violet);color:#fff;box-shadow:0 8px 22px rgba(20,33,61,.22)}
body.t-classic .primary svg{stroke:#fff}
body.t-classic .mini-bar i{background:var(--gold)}
body.t-classic .art{background:#F1F3F7!important;box-shadow:inset 0 0 0 1px rgba(20,33,61,.06)}
body.t-classic .seg button.on{box-shadow:0 1px 6px rgba(20,33,61,.12)}
body.t-classic .dictchip{border-color:rgba(176,141,60,.45)}body.t-classic .bar i,body.t-classic .pbar i{background:linear-gradient(90deg,#1C3557,#B08D3C)}
body.t-classic .ghead{text-transform:none;letter-spacing:.01em;color:var(--gold);font-weight:700}
body.t-classic .chip.on,body.t-classic .lm.on{background:var(--violet);color:#fff}
body.t-classic .trow .go{background:var(--violet)!important}
body.t-classic .flame em{color:#7A5A12}
body.t-classic .hero h2{color:var(--violet);letter-spacing:.12em}
body.t-classic .hero .tag{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:0}
body.t-classic .newbest{color:#5C4512;background:linear-gradient(180deg,#F4E8C8,#E6D29E)!important}
body.t-classic .hist .facts .gold{background:#F3EBD6;color:#6B5216}
body.t-classic .leaf.on{background:var(--gold);border-color:#9A772C;box-shadow:0 0 6px rgba(176,141,60,.5)}
body.t-classic .leaf.half{background:linear-gradient(90deg,var(--gold) 50%,transparent 50%);border-color:#9A772C}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--ui);font-size:17px;letter-spacing:-.01em;
  background:var(--bgimg),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:12px}
body.easy{--ui:"Atkinson Hyperlegible",Verdana,sans-serif;--roman:"Atkinson Hyperlegible",Verdana,sans-serif;letter-spacing:.03em;word-spacing:.14em;line-height:1.55}
body.easy .la,body.easy .lm{letter-spacing:.04em;font-weight:700}
#app{zoom:var(--z,1);max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 18px 0}
.glass{background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.circle svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pillbtn{height:44px;padding:0 18px;border-radius:22px;font-weight:600;font-size:16px;flex:none}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:14px 4px 4px;line-height:1.1}
.sub{color:var(--ink2);margin:2px 4px 16px;font-size:15px;line-height:1.4}

/* cards & rows */
.card{border-radius:var(--r-card);padding:6px 0;margin-bottom:14px}
.card.pad{padding:18px}
.ghead{color:var(--ink2);font-size:15px;font-weight:600;margin:18px 6px 8px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:56px;padding:10px 18px;position:relative}
.row+.row::before,.row+.acc::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--hair)}
.row .lbl{flex:1;min-width:0}
.row .lbl small{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px;line-height:1.35}
.row .val{color:var(--ink2);font-size:16px;display:flex;align-items:center;gap:6px}
.row.danger{color:var(--bad);justify-content:center;font-weight:500}
.chev{width:9px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.open .chev{transform:rotate(90deg)}

/* segmented */
.seg{display:flex;padding:4px;border-radius:16px;background:rgba(30,24,56,.06);gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink2);transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 2px 10px rgba(70,48,140,.14)}
.seg.small button{padding:7px 4px;font-size:14px}
.seg.tabs button{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:8px 4px}
.seg.tabs b{font-size:18px}.seg.tabs small{font-size:13px;white-space:nowrap}
.field{padding:12px 16px}
.field .flabel{font-size:14px;color:var(--ink2);margin:0 4px 8px;font-weight:500}

/* buttons */
.dock{position:sticky;bottom:0;margin:auto -18px 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 92%,transparent) 40%);display:flex;flex-direction:column;gap:10px;z-index:5}
.primary{height:60px;border-radius:30px;background:linear-gradient(180deg,#FFDA7A,#F5BC45 55%,#EAA62C);color:var(--gold-ink);
  font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 10px 26px rgba(234,166,44,.35);transition:transform .12s}
.primary:active{transform:scale(.98)}
.primary[disabled]{opacity:.45;box-shadow:none}.ticks{margin:0;padding:0 0 0 2px;list-style:none}.ticks li{position:relative;padding:7px 0 7px 26px;line-height:1.4}.ticks li:before{content:"";position:absolute;left:4px;top:13px;width:10px;height:5px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}.lockedrow .lbl{opacity:.85}.lockic{width:20px;height:20px;flex:none;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.trow .art .lockic{width:26px;height:26px;stroke:var(--violet)}.unlockhero{text-align:center;padding:6px 6px 14px}.unlockhero .tag{display:inline-block;font-family:var(--roman);letter-spacing:.14em;font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:5px 14px;margin-bottom:14px}.unlockhero h2{font-size:25px;line-height:1.25;margin:0 0 8px}.unlockhero p{color:var(--ink2);margin:0}
.secondary{height:52px;border-radius:26px;font-size:17px;font-weight:600}
.duo{display:flex;gap:10px}.duo>*{flex:1}
.textbtn{color:var(--violet);font-weight:600;font-size:16px;padding:12px;text-align:center;width:100%}
.dictchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 12px;border-radius:18px;font-size:15px;font-weight:600;margin:4px 4px 18px}
.dictchip i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* home */
.today{border-radius:24px;padding:6px 0;margin-bottom:14px}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;position:relative}
.trow.rv::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.trow .tt{flex:1;min-width:0}.trow .tt b{display:block;font-size:17px}.trow .tt small{color:var(--ink2);font-size:14px;line-height:1.35}
.ringwrap{position:relative;width:52px;height:52px;flex:none}.ring{width:52px;height:52px}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums lining-nums}
.flame{display:flex;align-items:center;gap:2px;background:#FFF0C7;border-radius:14px;padding:5px 10px 5px 6px;flex:none}
.flame svg{width:20px;height:20px}.flame em{font-style:normal;font-weight:800;color:var(--gold-ink)}
.trow .art{width:52px;height:52px;border-radius:16px;background:#DDF5EA;display:grid;place-items:center;flex:none}.trow .art svg{width:28px;height:28px}
.swatches{justify-content:space-between;flex-wrap:wrap;gap:12px 4px;padding:14px 8px}.sw{min-width:72px}.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink2);flex:1}.sw i{width:44px;height:44px;border-radius:50%;background:var(--bgimg),var(--bg);border:1px solid var(--hair);box-shadow:0 1px 3px rgba(30,24,56,.12)}.sw.on i{outline:2.5px solid var(--violet);outline-offset:2px}.sw.on span{color:var(--ink);font-weight:600}
.temple{width:100%;max-width:300px;display:block;margin:4px auto 0}.temple.sm{width:86px;flex:none;margin:0}
.templecard{padding:22px 18px 18px;text-align:center}.tstage{font-family:var(--serif,inherit);font-size:24px;font-weight:700;margin-top:10px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.badge .medal{width:44px;height:44px}.badge b{font-size:13.5px;line-height:1.2}.badge small{font-size:11.5px;color:var(--ink2);line-height:1.3}
.badge:not(.on){opacity:.72}.badge:not(.on) b{color:var(--ink2)}
.fw,.recap,.wotd{margin-top:14px;padding:16px 18px}.fwtop{display:flex;align-items:center;justify-content:space-between}.fwtop b{font-size:17px}.fwtop span{color:var(--ink2);font-size:13.5px}
.recap .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(20,33,61,.06);border:0;padding:0;color:var(--ink2)}.recap .x svg{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2.2;stroke-linecap:round}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px;text-align:center}.rgrid b{display:block;font-size:22px;font-family:var(--serif,inherit)}.rgrid span{font-size:12px;color:var(--ink2)}.recap>small{color:var(--ink2);font-size:13.5px}
.wotd{text-align:center}.wotd .fwtop{text-align:left}.wla{font-family:var(--roman);font-size:32px;letter-spacing:.06em;margin-top:6px}.wform{color:var(--ink2);font-size:14px;margin-top:2px}.wen{font-size:18px;font-weight:600;margin-top:8px}.wotd .hintline{margin-top:6px}
.star{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:0;background:none;color:rgba(20,33,61,.22);padding:0;cursor:pointer;flex:none}.star svg{width:21px;height:21px}.star.on{color:var(--gold)}
.searchbox{display:flex;align-items:center;gap:10px;border-radius:16px;padding:0 14px;margin:6px 0 10px}.searchbox svg{width:19px;height:19px;color:var(--ink2);flex:none}
.searchbox input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:13px 0;outline:none}
.wchips{margin-bottom:10px}.wlist{padding:4px 0}.wrow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--hair)}.wrow:last-child{border-bottom:0}
.wl{flex:1;min-width:0}.wl b{display:block;font-size:15px;font-weight:600}.wl small{display:block;color:var(--ink2);font-size:13.5px;margin-top:1px}
body.hastabs #app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(452px,calc(100% - 24px));display:flex;justify-content:space-around;padding:6px;border-radius:24px;z-index:40;zoom:calc(1/var(--z,1))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;border:0;background:none;color:var(--ink3);font:inherit;font-size:11.5px;font-weight:600;border-radius:18px;cursor:pointer}
.tabbar button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tabbar button.on{color:var(--violet);background:var(--violet-soft)}
.homebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin:4px 0 18px}.homebar .dictchip{margin:0;min-width:0;max-width:62%;padding:0 10px 0 10px}.homebar .dictchip svg{flex:none}.homebar .dictchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.homebar .statpill{flex:none;padding:0 10px 0 6px}
.statpill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 8px;border-radius:19px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.statpill .minring svg{width:24px;height:24px;display:block}.statpill svg{width:17px;height:17px}.statpill .sep{width:1px;height:16px;background:var(--hair);margin:0 2px}
.fwart{display:grid;place-items:center}.fwart b{font-size:13px;color:var(--gold)}
.lastwk{display:block;color:var(--ink2);font-size:13px}
.brand{margin-bottom:0}.latin-mark{font-family:Cinzel,var(--roman),serif;font-size:.62em;letter-spacing:.16em;color:var(--mark,#8F6F28);font-weight:600;vertical-align:baseline;margin-left:.3em}.brand{white-space:nowrap}.t-dusk .latin-mark,.t-original .latin-mark{--mark:var(--gold)}.tagline{font-family:var(--serif,Georgia),Georgia,serif;font-style:italic;font-size:19px;color:var(--gold);margin:0 0 12px 2px}
.plan .bar{height:8px;border-radius:4px;background:rgba(30,24,56,.08);overflow:hidden;margin:8px 0 2px}.plan .bar i{display:block;height:100%;background:var(--violet);border-radius:4px}
.planform input[type=date]{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--hair);background:#fff;color:var(--ink)}
.trow .go{background:var(--ok);color:#fff;font-weight:700;font-size:15px;padding:8px 14px;border-radius:16px;flex:none}
.review{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:22px;padding:14px 16px;margin-bottom:14px}
.review .art{width:46px;height:46px;border-radius:15px;background:#DDF5EA;display:grid;place-items:center;flex:none}
.review .art svg{width:26px;height:26px}
.review b{display:block;font-size:17px}
.review small{color:var(--ink2);font-size:14px}
.review .go{margin-left:auto;background:var(--ok);color:#fff;font-weight:700;font-size:15px;padding:8px 14px;border-radius:16px;flex:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.tile{border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:156px;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .art{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;margin-bottom:4px}
.tile .art svg{width:30px;height:30px}
.tile h2{margin:0;font-size:18px;letter-spacing:-.02em;line-height:1.15}
.tile p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.35}
.tile.lead{grid-column:span 2;min-height:0;padding:20px;flex-direction:row;align-items:center;gap:16px;
  background:linear-gradient(135deg,rgba(255,244,214,.95),rgba(255,255,255,.7) 60%)}
.tile.lead .art{width:68px;height:68px;border-radius:22px;margin:0;flex:none}
.tile.lead .art svg{width:40px;height:40px}
.tile.lead h2{font-size:24px}
.tile.lead .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mini-bar{height:6px;border-radius:3px;background:rgba(30,24,56,.08);overflow:hidden;margin-top:4px}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,#EAA62C,#F5BC45)}
.tile .mt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums lining-nums}

/* setup */
.progress{border-radius:24px;padding:16px 18px 18px;margin-bottom:14px}
.progress .ptop{display:flex;align-items:baseline;gap:6px}
.progress .ptop b{font-size:28px;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.progress .ptop span{color:var(--ink2);font-size:15px}
.progress .ptop em{margin-left:auto;font-style:normal;font-weight:700;color:var(--violet);font-variant-numeric:tabular-nums lining-nums}
.pbar{height:10px;border-radius:5px;background:rgba(30,24,56,.08);overflow:hidden;margin:10px 0 8px}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--violet),#A48CFF);transition:width .4s}
.progress small{color:var(--ink2);font-size:13.5px}
.acc{position:relative}
.sheet-bg{position:fixed;inset:0;background:rgba(30,24,56,.28);z-index:15}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:82vh;z-index:16;
  border-radius:30px 30px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);background:rgba(250,248,255,.96)}
.sheet.in{animation:sheetup .3s cubic-bezier(.2,.8,.2,1)}.sheet-bg.in{animation:fadein .3s}@keyframes sheetup{from{transform:translate(-50%,100%)}}@keyframes fadein{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(30,24,56,.18);margin:10px auto 4px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px 12px}
.shead b{font-size:20px;display:block}.shead small{color:var(--ink2);font-size:14px}
.sbody{overflow-y:auto;padding:4px 18px 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.clabel{font-size:13px;color:var(--ink2);font-weight:600;margin:4px 2px 8px}
.chip{height:36px;padding:0 12px;border-radius:18px;background:rgba(30,24,56,.06);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.chip small{opacity:.65;font-size:12px;font-variant-numeric:tabular-nums lining-nums}
.chip.on{background:var(--violet);color:#fff}
.chip.all{background:none;color:var(--violet);font-weight:600;padding:0 6px}
.lettersm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.lm{height:40px;border-radius:12px;font-family:var(--roman);font-size:16px;font-weight:600;background:rgba(30,24,56,.06);color:var(--ink3);transition:.15s}
.lm.on{background:var(--violet);color:#fff}
.lm[disabled]{visibility:hidden}
.verbforms{border-top:1px solid var(--hair);padding-top:12px;margin-top:4px}

/* runs */
.bar{flex:1;height:6px;border-radius:3px;background:rgba(30,24,56,.08);overflow:hidden;margin:0 6px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--violet),#A48CFF);transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;margin:16px 6px 12px;color:var(--ink2);font-size:15px;font-variant-numeric:tabular-nums lining-nums}
.meta b{color:var(--ink);font-weight:600}
.clock{font-variant-numeric:tabular-nums lining-nums;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:4px 10px;border-radius:12px}
.laurels{display:flex;gap:6px;align-items:center}
.leaf{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink3);transition:.25s}
.leaf.half{background:linear-gradient(90deg,var(--gold) 50%,transparent 50%);border-color:#E3A12A}
.leaf.on{background:var(--gold);border-color:#E3A12A;box-shadow:0 0 8px rgba(242,181,58,.7)}
.prompt{border-radius:30px;padding:28px 20px 30px;text-align:center;position:relative}
.hintbtn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:rgba(176,141,60,.10);border:1px solid rgba(176,141,60,.35);cursor:pointer;padding:0}
.hintbtn svg{width:21px;height:21px}.hintbtn:active{transform:scale(.94)}
.hintline{margin:14px auto 0;font-size:16px;color:var(--ink2)}.hintline b{color:var(--violet);font-weight:700;border-bottom:2px solid var(--gold)}
.prompt .ask{color:var(--ink2);font-size:15px}
.prompt .explain{margin-top:14px;color:var(--ink2);font-size:15px;line-height:1.4}
.prompt .explain b{color:var(--ink)}
.word{font-family:var(--roman);font-weight:600;letter-spacing:.06em;line-height:1.15;margin-top:14px;word-break:break-word}
.word.en{font-family:var(--ui);font-weight:600;letter-spacing:-.01em}
.word small{font-family:var(--ui);font-size:.5em;letter-spacing:0;color:var(--ink2);font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-bottom:24px}
.opt{min-height:60px;border-radius:var(--r-row);padding:12px 18px;font-size:17px;text-align:left;display:flex;align-items:center;gap:12px;transition:background .2s,border-color .2s,transform .12s}
.opt:active{transform:scale(.985)}
.opt .k{width:28px;height:28px;border-radius:9px;background:rgba(30,24,56,.06);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2);flex:none}
.opt.la span:last-child{font-family:var(--roman);font-weight:600;letter-spacing:.04em}
.opt.ok{background:#E3F7EC;border-color:var(--ok)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:#FCE6E7;border-color:var(--bad)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.fade{opacity:.5}
.typebox{margin-top:18px}
.typebox input,.wallin{width:100%;height:60px;border-radius:var(--r-row);padding:0 18px;font-size:19px;outline:0;background:rgba(255,255,255,.85);border:1.5px solid rgba(30,24,56,.12)}
.typebox input:focus,.wallin:focus{border-color:var(--violet)}
.typebox input.ok{border-color:var(--ok);background:#E3F7EC}
.typebox input.bad{border-color:var(--bad);background:#FCE6E7}
.reveal{margin:12px 6px 0;color:var(--ink2);min-height:22px}
.reveal b{color:var(--ok);font-weight:600}

/* flashcards */
.deck{perspective:1400px;margin-top:6px}
.flash{position:relative;height:min(52vh,400px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer;touch-action:pan-y}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.face.backside{transform:rotateY(180deg);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(238,233,255,.75))}
.face .hint{position:absolute;bottom:22px;left:0;right:0;color:var(--ink3);font-size:14px}
.face .side{position:absolute;top:20px;left:0;right:0;color:var(--ink3);font-size:14px;font-weight:500}
.dform{font-family:var(--roman);font-weight:600;letter-spacing:.03em;font-size:17px;color:var(--violet);margin:10px 0 4px}
.rate{display:flex;gap:10px;margin:18px 0 24px}
.rate button{flex:1;height:58px;border-radius:29px;font-weight:700;font-size:17px}
.rate .no{background:#fff;color:var(--bad);border:1.5px solid rgba(229,72,77,.35)}
.rate .yes{background:var(--ok);color:#fff;box-shadow:0 8px 22px rgba(23,168,102,.3)}
.rate.wait button{opacity:.35;pointer-events:none}

/* match */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 24px}
.mt-tile{min-height:84px;border-radius:18px;padding:8px;font-size:14px;line-height:1.25;display:grid;place-items:center;text-align:center;transition:transform .15s,opacity .25s,background .15s,border-color .15s}
.mt-tile.la{font-family:var(--roman);font-weight:600;letter-spacing:.03em;font-size:14.5px}
.mt-tile.sel{border-color:var(--violet);background:#EEE9FF;transform:scale(1.03)}
.mt-tile.bad{border-color:var(--bad);background:#FCE6E7;animation:shake .35s}
.mt-tile.gone{opacity:0;pointer-events:none;transform:scale(.8)}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* defend the wall */
.lives{display:flex;gap:4px}
.brick{width:22px;height:14px;border-radius:3px;background:#C98A3A;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.brick.lost{background:rgba(30,24,56,.12);box-shadow:none}
.wlvl{position:absolute;top:8px;left:12px;margin:0;z-index:2}.wallin{height:52px!important}.field-wall{position:relative;height:max(300px,calc(100vh - 330px));transition:height .2s;border-radius:26px;overflow:hidden;margin:4px 0 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(238,233,255,.6))}
.wallbase{position:absolute;left:0;right:0;bottom:0;height:36px;
  background:repeating-linear-gradient(90deg,#D49A4A 0 46px,#B97B30 46px 48px),#D49A4A;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.12)}
.wallbase::after{content:"";position:absolute;left:0;right:0;top:17px;height:2px;background:#B97B30}
.field-wall.hurt{animation:hurt .4s}@keyframes hurt{30%{background:rgba(229,72,77,.18)}}
.foe{position:absolute;top:0;left:0;padding:8px 12px;border-radius:14px;background:#fff;box-shadow:0 6px 16px rgba(70,48,140,.18);
  font-family:var(--roman);font-weight:700;font-size:16px;letter-spacing:.04em;white-space:nowrap;will-change:transform}
.foe.hit{transition:opacity .25s,transform .25s;opacity:0;background:#E3F7EC}
.lvl{font-size:13px;color:var(--ink2);text-align:center;margin:6px 0 18px}.stg{display:inline-block;font-family:var(--roman);font-size:12px;letter-spacing:.1em;color:var(--stc,var(--gold));border:1px solid var(--stc,var(--gold));border-radius:10px;padding:2px 9px;margin:0 0 6px}
.prompt.st1{--stc:#9A6435;border-top:4px solid #B8804F}.prompt.st2{--stc:#6E7884;border-top:4px solid #A3ACB6}.prompt.st3{--stc:#9A7A2E;border-top:4px solid #C9A245}
.sthead.s1{color:#9A6435}.sthead.s2{color:#6E7884}.sthead.s3{color:#9A7A2E}.tlines{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:13.5px;color:var(--ink2);margin-top:6px}.tlines b{font-weight:600;margin-right:4px}.tlines .c1{color:#9A6435}.tlines .c2{color:#6E7884}.tlines .c3{color:#9A7A2E}.gnote{font-size:13px;line-height:1.45;color:var(--ink2);margin:-2px 4px 10px}.country{font-family:var(--roman);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:26px 2px 2px;padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}.country+.ghead{margin-top:10px}.stagestrip{display:flex;justify-content:center;gap:16px;font-size:12.5px;color:var(--ink2);margin:-4px 0 10px}.stagestrip b{font-family:var(--roman);margin-right:3px}.stagestrip .s1 b{color:#9A6435}.stagestrip .s2 b{color:#6E7884}.stagestrip .s3 b{color:#9A7A2E}
.sb .r1{color:#9A6435}.sb .r2{color:#6E7884}.sb .r3{color:#9A7A2E}.prompt .ask{padding:0 34px}.stepnote{font-size:13px;color:var(--ink2);margin:10px 2px 0;line-height:1.45}.stagebars{margin:10px 0 6px}.sb{display:grid;grid-template-columns:24px 1fr 90px 52px;align-items:center;gap:8px;font-size:13px;padding:4px 0}.sb .r{font-family:var(--roman);color:var(--gold);font-weight:600}.sb .bar{height:6px;border-radius:4px;background:rgba(20,33,61,.1);overflow:hidden}.sb .bar i{display:block;height:100%;background:linear-gradient(90deg,#1C3557,#B08D3C)}.sb .v{text-align:right;color:var(--ink2)}.wst{display:flex;gap:4px;margin:0 8px}.wst i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold)}.wst i.on{background:var(--gold)}.wst i.cur{background:color-mix(in srgb,var(--gold) 35%,transparent)}.prompt .explain{height:66px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.35;margin-top:8px}.prompt .explain .dmean{color:var(--ink2);font-style:italic}

/* summary */
.score{text-align:center;padding:22px 16px 18px}
.score .big{font-family:var(--roman);font-size:60px;font-weight:600;line-height:1}
.score .big span{color:var(--ink3);font-size:.55em}
.score p{margin:10px 0 0;color:var(--ink2)}
.timebox{display:flex;justify-content:center;gap:10px;margin:0 0 16px}
.timebox div{border-radius:18px;padding:10px 16px;text-align:center;min-width:120px}
.timebox b{display:block;font-size:22px;font-variant-numeric:tabular-nums lining-nums}
.timebox span{font-size:13px;color:var(--ink2)}
.newbest{color:var(--gold-ink);background:linear-gradient(180deg,#FFE8A8,#F8C95A)!important}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 18px;position:relative}
.srow+.srow::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--hair)}
.srow .la{font-family:var(--roman);font-weight:600;letter-spacing:.04em;font-size:15px}
.srow .la small{display:block;font-family:var(--ui);font-weight:400;letter-spacing:0;font-size:12.5px;color:var(--ink2);margin-top:2px}
.srow .en{color:var(--ink2);text-align:right;font-size:15px}
.empty{color:var(--ink2);text-align:center;padding:32px 20px;line-height:1.5}

/* congratulations */
.hero{text-align:center;padding:10px 0 6px;position:relative}
.crown{position:relative;width:240px;height:230px;margin:0 auto}.wreath{width:240px;height:230px;display:block}
.hero h2{position:absolute;left:0;right:0;top:92px;margin:0;font-family:var(--roman);font-size:30px;letter-spacing:.08em;color:#4A3205}
.hero .tag{margin:10px 20px 6px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero p{margin:0 24px;color:var(--ink2);line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}
.stats div{border-radius:20px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums lining-nums}
.stats span{font-size:12.5px;color:var(--ink2)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* settings / history */
.toggle{width:52px;height:32px;border-radius:16px;background:rgba(30,24,56,.14);position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toggle.on{background:var(--ok)}.toggle.on::after{left:22px}
.stepper{display:flex;align-items:center;gap:4px;background:rgba(30,24,56,.06);border-radius:14px;padding:3px}
.stepper button{width:34px;height:30px;border-radius:10px;font-size:20px;line-height:1}
.stepper button:not(:disabled):active{background:#fff}
.stepper button:disabled{opacity:.3}
.stepper span{min-width:46px;text-align:center;font-variant-numeric:tabular-nums lining-nums;font-size:15px;font-weight:600}
.note{color:var(--ink2);font-size:13.5px;line-height:1.45;margin:-4px 8px 18px}
.radio{width:22px;height:22px;stroke:var(--violet);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hist{border-radius:24px;padding:16px 18px;margin-bottom:12px}
.hist h3{margin:0;font-size:17px}
.hist .d{color:var(--ink2);font-size:14px;margin-top:3px;line-height:1.4}
.hist .facts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.hist .facts span{font-size:13px;background:rgba(30,24,56,.06);padding:5px 10px;border-radius:10px}
.hist .facts .gold{background:#FFF0C7;color:var(--gold-ink)}
.hist .acts{display:flex;gap:8px}
.hist .acts button{flex:1;height:42px;border-radius:21px;font-weight:600;font-size:15px}
.hist .again{background:var(--violet);color:#fff}
.hist .wipe{background:#fff;color:var(--bad);border:1.5px solid rgba(229,72,77,.3)}
.badge{font-size:12px;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:3px 8px;border-radius:8px;margin-left:6px;vertical-align:2px}
.info p{margin:0 0 14px;line-height:1.55;color:var(--ink2)}
.info h3{margin:4px 0 6px;font-size:17px}

/* overlays */
.modal{position:fixed;inset:0;background:rgba(30,24,56,.25);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.dlg{border-radius:28px;width:100%;max-width:330px;padding:22px 18px 16px;text-align:center}
.dlg p{margin:0 0 18px;line-height:1.45}
.dlg .duo button{height:48px;border-radius:24px;font-weight:600}
.dlg .warn{background:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 18px;border-radius:20px;
  font-size:15px;z-index:30;width:max-content;max-width:86%;text-align:center}
.loading{flex:1;display:grid;place-items:center;color:var(--ink2)}@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- ranks: bronze, silver, gold, platinum ---- */
:root{--rb:#9A6435;--rbf:#B8804F;--rs:#6E7884;--rsf:#A3ACB6;--rg:#9A7A2E;--rgf:#C9A245;--rp:#4F7096;--rpf:linear-gradient(135deg,#F4F8FC,#C9D8E8 55%,#9FB6CF)}
.rankkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:2px 4px 10px}.rankkey span{display:inline-flex;align-items:center;gap:6px}
.rankkey i,.testcard .medal{display:inline-block;border-radius:50%;flex:none}.rankkey i{width:11px;height:11px}
.m1{background:var(--rbf)}.m2{background:var(--rsf)}.m3{background:var(--rgf)}.m4{background:var(--rpf);box-shadow:inset 0 0 0 1px #8DA6C2}
.tests{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.testcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid transparent;cursor:pointer;color:var(--ink);font:inherit}
.testcard .tx{display:flex;flex-direction:column;gap:2px;flex:1}.testcard b{font-size:16px}.testcard b small{font-size:11.5px;font-weight:600;color:var(--violet,#6B4EE6);margin-left:6px}.testcard .tx>small{font-size:13px;color:var(--ink2);line-height:1.35}
.testcard .medal{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--rbf),var(--rsf) 50%,var(--rgf))}
.testcard.t1 .medal{background:var(--rbf)}.testcard.t2 .medal{background:var(--rsf)}.testcard.t3 .medal{background:var(--rgf)}
.testcard.on{border-color:var(--gold)}.testcard.t1.on{border-color:var(--rbf)}.testcard.t2.on{border-color:var(--rsf)}.testcard.t3.on{border-color:var(--rgf)}
.seg.bdir{margin:-2px 0 4px}.timepick{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px;border:1px solid #D8DAE2;background:#fff;color:var(--ink)}.ywdone{margin-top:10px;font-size:14px;font-weight:600;color:var(--rg)}
.prompt.lit{transition:background .25s}.prompt.lit1{background:#F4E6D8}.prompt.lit2{background:#ECEFF3}.prompt.lit3{background:#F7EED3}.prompt.lit4{background:#E6EEF7}
.littag{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;background:#fff}
.prompt.lit1 .littag{color:var(--rb)}.prompt.lit2 .littag{color:var(--rs)}.prompt.lit3 .littag{color:var(--rg)}.prompt.lit4 .littag{color:var(--rp)}
.fwlist{display:flex;flex-direction:column;padding:0 6px 6px}.fwrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 8px;border:0;background:none;border-top:1px solid rgba(0,0,0,.06);font:inherit;color:var(--ink);cursor:pointer}
.fwrow .tt{flex:1;display:flex;flex-direction:column}.fwrow small{color:var(--ink2);font-size:12.5px}.fwrow .tick{width:22px;height:22px;border-radius:50%;border:2px solid #C9CCD6;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.fwrow.done .tick{background:#3E9B5F;border-color:#3E9B5F}.fwrow.done b{text-decoration:line-through;color:var(--ink2)}.fwchev{display:flex}.fwchev svg{transition:transform .2s}.fwchev.open svg{transform:rotate(90deg)}
.yourwords{padding:16px 18px;margin-bottom:16px}.yourwords .flabel{font-size:13px;color:var(--ink2);margin-bottom:4px}.yourwords .ywname{display:block;font-size:19px;line-height:1.3}.yourwords small{display:block;color:var(--ink2);font-size:13px;margin-top:4px}
.ywbtns{display:flex;gap:10px;margin-top:12px}.ywbtns button{flex:1;height:44px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer}
.trials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.trial{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;border:2px solid transparent;font:inherit;color:var(--ink);cursor:pointer}
.trial b{font-size:15px}.trial span{font-size:12.5px;font-weight:600}.trial.t1 span{color:var(--rb)}.trial.t2 span{color:var(--rs)}.trial.t3 span{color:var(--rg)}.trial small{font-size:11.5px;color:var(--ink2);text-align:center}.trial:disabled{opacity:.55;cursor:default}
.prompt .clue{font-family:inherit;font-size:14px;letter-spacing:0;font-style:italic;color:var(--ink2);margin-top:6px}
.nwlist .srow{display:flex;justify-content:space-between;gap:12px}.closer{font-size:13.5px;color:var(--ink2);margin-top:4px}.tlabel{margin:4px 4px 8px;font-size:14px;color:var(--ink2);font-weight:500}

="translate(766.4 710.8) rotate(-15.1)" fill="#D4AF5A"></path> <path d="M0 0 Q51.5 -30.2 103.0 0 Q51.5 30.2 0 0 Z" transform="translate(766.4 710.8) rotate(-91.1)" fill="#D4AF5A"></path> <path d="M0 0 Q48.5 -28.8 97.0 0 Q48.5 28.8 0 0 Z" transform="translate(811.5 626.8) rotate(-32.4)" fill="#D4AF5A"></path> <path d="M0 0 Q48.5 -28.8 97.0 0 Q48.5 28.8 0 0 Z" transform="translate(811.5 626.8) rotate(-108.4)" fill="#D4AF5A"></path> <path d="M0 0 Q45.5 -27.2 91.0 0 Q45.5 27.2 0 0 Z" transform="translate(829.7 533.2) rotate(-49.6)" fill="#D4AF5A"></path> <path d="M0 0 Q45.5 -27.2 91.0 0 Q45.5 27.2 0 0 Z" transform="translate(829.7 533.2) rotate(-125.6)" fill="#D4AF5A"></path> <path d="M0 0 Q42.5 -25.8 85.0 0 Q42.5 25.8 0 0 Z" transform="translate(819.3 438.4) rotate(-66.9)" fill="#D4AF5A"></path> <path d="M0 0 Q42.5 -25.8 85.0 0 Q42.5 25.8 0 0 Z" transform="translate(819.3 438.4) rotate(-142.9)" fill="#D4AF5A"></path> <path d="M0 0 Q39.5 -24.2 79.0 0 Q39.5 24.2 0 0 Z" transform="translate(781.3 350.9) rotate(-84.1)" fill="#D4AF5A"></path> <path d="M0 0 Q39.5 -24.2 79.0 0 Q39.5 24.2 0 0 Z" transform="translate(781.3 350.9) rotate(-160.1)" fill="#D4AF5A"></path> <path d="M0 0 Q36.5 -22.8 73.0 0 Q36.5 22.8 0 0 Z" transform="translate(719.1 278.6) rotate(-101.4)" fill="#D4AF5A"></path> <path d="M0 0 Q36.5 -22.8 73.0 0 Q36.5 22.8 0 0 Z" transform="translate(719.1 278.6) rotate(-177.4)" fill="#D4AF5A"></path> <path d="M0 0 Q35.0 -20.0 70.0 0 Q35.0 20.0 0 0 Z" transform="translate(680.5 250.3) rotate(-148.0)" fill="#D4AF5A"></path> <circle cx="512" cy="842" r="16" fill="#D4AF5A"></circle> <text x="512" y="638" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="360" fill="#D4AF5A">G</text> </svg><div class="spl-t"><div><p class="spl-e"><b>gradus</b>, -ūs, <i>m.</i></p><p class="spl-m">a step; a stage, degree</p></div><div class="spl-r"></div><p class="spl-g">A step-by-step guide<br>to mastering German</p></div></div>

<script>
/* Opening splash. In the phone app it first sits exactly where the phone's launch image is (the wreath centred, about
   667/2732 of the screen height across), so the two cross-fade invisibly. Only once the launch image has gone does the
   wreath rise and the entry fade in; then the screen fades away. Tap to skip. */
let splashT=null;
function endSplash(){const el=document.getElementById("splash");if(!el||el.classList.contains("out"))return;clearTimeout(splashT);el.classList.add("out");
  try{dispatchEvent(new Event("gradus-splash-done"));}catch(e){} /* the phone app switches the status bar back to dark text */
  setTimeout(()=>el.remove(),500);}
(function(){const el=document.getElementById("splash");if(!el)return;const w=el.querySelector(".spl-w");
  const r=w.getBoundingClientRect(),H=innerHeight,k=Math.max(.5,Math.min(3,(H*667/2732)/(r.width*.7385))),
    target=H*1385.5/2732, dy=target-k*(23/1024)*r.height-(r.top+r.height/2); /* the wreath sits 23/1024 below the drawing's centre */
  w.style.transition="none";w.style.transform=`translateY(${dy.toFixed(1)}px) scale(${k.toFixed(3)})`;
  let go=false;const rise=()=>{if(go)return;go=true;requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.transition="";w.style.transform="";el.classList.add("in");splashT=setTimeout(endSplash,2400);}));};
  if(window.GradusNative&&!window.__launchGone){addEventListener("gradus-launch-gone",rise,{once:true});setTimeout(rise,3000);}else setTimeout(rise,250);})();

/* ================= DATA ================= */
const CATS=[["vreg","Verbs","Regular"],["virr","Verbs","Irregular"],["vsep","Verbs","Separable"],["vrefl","Verbs","Reflexive"],
 ["nm","Nouns","Masculine"],["nf","Nouns","Feminine"],["nn","Nouns","Neuter"],["npl","Nouns","Plural only"],
 ["art","Other words","Articles"],["pron","Other words","Pronouns"],["adj","Other words","Adjectives"],["adv","Other words","Adverbs"],
 ["conj","Other words","Conjunctions"],["prep","Other words","Prepositions"],["num","Other words","Numbers"],["phr","Other words","Phrases"]];
const BASE_LETTERS="ABDEFGHIJKLMNOPRSTUVWZ".split("");
const MODES={
  test:{name:"Tester",start:"Start test",unit:"questions"},
  fc:{name:"Flashcards",start:"Start flashcards",unit:"cards"},
  match:{name:"Match",start:"Start matching",unit:"pairs"},
  deriv:{name:"Word cousins",start:"Find cousins",unit:"questions"},
  wall:{name:"Defend the wall",start:"Defend the wall",unit:"words"},
  review:{name:"Daily review",start:"Start review",unit:"words"}};
/* Lists by country, then by level (lowest first) */
const DICT_TREE=[
  ["Any course",[["Free to try",["core"]],["Beginner and Intermediate",["beg","inter"]]]]];
/* a short note under some section headings */
const GROUP_NOTES={"Beginner and Intermediate":"Beginner is roughly level A1 on the European scale for languages: about the first year or two of school German. Intermediate is roughly A2: about Year 10, or a UK GCSE. Each list includes the one before it."};
const SOON=g=>`<div class="ghead">${g}</div>${GROUP_NOTES[g]?`<p class="gnote">${GROUP_NOTES[g]}</p>`:""}<div class="card glass"><div class="row"><span class="lbl">Coming soon<small>German Beginner (about A1) and German Intermediate (about A2)</small></span></div></div>`;
/* Full Access: one purchase unlocks every list. Only the free list is open without it. */
const FREE=["core"];
const locked=k=>!S.full&&!FREE.includes(k);
const W="*";   // progress, reviews, tricky words and stars are shared by every list   // old tiered lists now point to the current untiered ones
const INT=[1,3,7,14,30,60];       // Daily review gaps in days
/* English derivatives: latin headword : English word [: category when the headword is shared] */
const DERIV_SRC="haus:house|buch:book|wasser:water|mann:man|mutter:mother|vater:father|bruder:brother|schwester:sister|trinken:drink|kommen:come|finden:find|sehen:see|geben:give|gut:good|neu:new|alt:old|freund:friend|woche:week|jahr:year|tag:day|nacht:night|hund:hound|katze:cat|lernen:learn|hören:hear|familie:family|morgen:morning:nm|kind:kindergarten|schule:school|uhr:hour|hier:here|haben:have|können:can|müssen:must|wollen:will|essen:eat|schlafen:sleep|sagen:say|machen:make|denken:think|wissen:wise|stehen:stand|sprechen:speech|fahren:farewell|zeit:zeitgeist|groß:gross|und:and|was:what|wann:when|wo:where|für:for|danke:thank|hallo:hello|zwei:two|drei:three|vier:four|fünf:five|sechs:six|sieben:seven|acht:eight|neun:nine|zehn:ten|eins:one|mein:mine|wir:we|auto:automobile|kennen:ken|zimmer:timber|stadt:homestead|mädchen:maiden|junge:young";

/* Why? lines for Derivative detective: _word_ marks the German meaning (shown underlined) */
const DERIV_WHY={"house":"German and English are sister languages, so everyday words like _house_ still look alike.","hound":"A hound is a hunting _dog_. In German, every dog is a Hund.","kindergarten":"A kindergarten is a garden for young _children_. English borrowed the German word.","hour":"An Uhr is a _clock_: it tells you the hour.","will":"Careful! German will means _wants_: er will = he wants. English will once meant that too.","wise":"Someone wise _knows_ a lot.","farewell":"Farewell once meant 'travel well'. Fahren is to _go_ by car, bus or train.","zeitgeist":"The zeitgeist is the spirit of the _time_. English borrowed it from German.","gross":"A gross is twelve dozen, a _big_ number. Gross once meant big in English too.","speech":"Speech is what you make when you _speak_.","timber":"Zimmer once meant timber, because rooms were built of wood. Now it means a _room_.","homestead":"Stead means a place, as in homestead. A Stadt is a _town_.","maiden":"Maiden is an old word for a _girl_ or young woman.","young":"A Junge is a _boy_: a young person.","mine":"Mein means _my_, just like mine.","morning":"Morgen and morning both mean the start of the day: the _morning_.","automobile":"An Auto is short for automobile: a _car_.","ken":"Your ken is what you _know_, as in 'beyond my ken'.","can":"Können is to be _able to_: ich kann = I can.","must":"Müssen means _must_, to have to."};
/* Word families: an English word from one member can also be traced to the others (clamour: clamor or clamo).
   Only true etymological families, so look-alikes such as porta/porto or servus/servo stay apart. */
const DFAM_SRC="";
const FAM={};for(const g of DFAM_SRC.split("|")){const set=new Set(g.split(" "));for(const h of set)FAM[h]=set;}
const famOf=la=>FAM[headOf(la)];
const whyHTML=(d,la)=>{const t=DERIV_WHY[(la?headOf(la)+":":"")+d]||DERIV_WHY[d];return t?esc(t).replace(/_([^_]+)_/g,"<u>$1</u>"):"";};
let DICTS={}, ITEMS=[], LETTERS=BASE_LETTERS, DERIV=[], DQ=[], SETS=[], SETMAP={}, HINTS={};
const headOf=la=>la.replace(/·/g,"").replace(/^(der|die|das|sich)\s+/i,"").toLowerCase().split(/[ ,(]/)[0];
function loadDict(){
  if(S.course&&!DICTS[S.course])S.course=null;
  if(locked(S.dict))S.dict="core";
  const d=DICTS[S.dict]||DICTS.core; S.dict=d.key;
  ITEMS=d.items.map(([id,la,en,cat,part,letter,form])=>({id,la,en,cat,part,letter,form:form||""}));
  SETS=(d.sets||[]).map(([unit,label,ids])=>({unit,label,ids})); SETMAP={}; SETS.forEach(st=>SETMAP[st.label]=new Set(st.ids));
  const extra=[...new Set(ITEMS.map(i=>i.letter))].filter(L=>!BASE_LETTERS.includes(L)).sort();
  LETTERS=BASE_LETTERS.concat(extra);
  const firsts=ITEMS.filter(i=>i.part===1), seen=new Set(); DERIV=[];
  for(const e of DERIV_SRC.split("|")){const [h,der,cat]=e.split(":");if(seen.has(h+":"+der))continue;
    const cands=firsts.filter(i=>headOf(i.la)===h&&(!cat||i.cat===cat)&&!/\(\+/.test(i.la)),
      src=cands.find(i=>i.la===h)||cands.find(i=>i.la.startsWith(h+","))||cands.find(i=>!i.la.includes(" ")||i.la.startsWith(h+" ("))||cands[0];
    if(!src)continue; seen.add(h+":"+der);
    DERIV.push({id:"d:"+h+":"+der,sid:src.id,la:src.la,en:src.en,cat:src.cat,letter:src.letter,part:1,der,form:src.form});}
  buildParts();
  HINTS={};for(const d of DERIV)(HINTS[d.sid]=HINTS[d.sid]||[]).push(d.der);
  /* Derivative detective: one question per German word; any of its English derivatives is right */
  DQ=Object.entries(HINTS).map(([sid,ders])=>{const s=ITEMS.find(i=>i.id===sid);return {id:"dq:"+sid,sid,la:s.la,en:s.en,cat:s.cat,letter:s.letter,part:1,form:s.form,ders};});
}

/* ================= STORE ================= */
const LS="gradusGerman.v1";
function defaults(){return{mode:"test",dir:"step",type:"mc",parts:"first",dict:"core",course:null,full:false,limit:20,cDelay:0.5,iDelay:1.5,
  spell:"auto",smart:true,progress:{},best:{},history:[],srs:{},daily:{},goal:20,bestStreak:0,onboarded:false,
  dlev:"easy",selMode:"chunk",selChunk:0,selGram:null,selAlpha:null,selSets:null,exam:{},ld:{},batch:{},miss:{},easy:false,zoom:"1",theme:"classic",badges:{},stats:{},freezes:1,frozen:{},holiday:null,holidays:[],revDone:{},seen:{},firstDay:null,fw:{},trk:{},trkOk:{},lsEver:{},ps:{}};}
let S=defaults();
try{const s=JSON.parse(localStorage.getItem(LS));if(s)S=Object.assign(defaults(),s);}catch(e){}
if(!S.classicSet){S.theme="classic";S.classicSet=true;}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}

const firstOnly=m=>m==="deriv"||m==="wall";
function keyFor(o){if(o.src)return `${o.dict}|${o.src}`;const p=firstOnly(o.mode)?"first":o.parts;
  if(o.mode==="test")return `${o.dict}|${o.dir}_${o.type}_${p}`;
  if(o.mode==="fc")return `${o.dict}|fc_${o.dir}_${p}`;
  if(o.mode==="review")return `${o.dict}|review`;
  return `${o.dict}|${o.mode}_${p}`;}
const exKey=()=>keyFor(S);

  if(S.daily[t]===S.goal)earn(DEN.goal);

    if(st>0&&st%7===0&&(S.freezes||0)<3){S.freezes=(S.freezes||0)+1;setTimeout(()=>toast(`${st}-day streak! You've earned a streak freeze.`),500);}}

const inHoliday=d=>(S.holiday!=null&&d>=S.holiday)||(S.holidays||[]).some(([a,b])=>d>=a&&d<=b);

/* Review keeps one schedule per form, at the highest rank it has reached */
function srsRecord(it,r,ok,isReview){if(!r||(!isReview&&rankOf(it)<1))return; /* review starts once a word has bronze */const top=Math.max(r,rankOf(it));if(r<top&&!isReview)return;

  const it=ex.q[ex.i], latinFirst=S.dir!=="el";
  const dform=it.form?`<div class="dform">${esc(it.form)}</div>`:"";
  const front=latinFirst?wordHTML(UP(it.la),true):wordHTML(it.en,false), backFace=(latinFirst?dform+wordHTML(it.en,false):wordHTML(UP(it.la),true)+dform);
  app.innerHTML=`${runTop(false,ex.i+1,ex.q.length)}
  <div class="meta"><span>Card <b>${ex.i+1}</b> of ${ex.q.length}</span>${leavesHTML(it)}${rightSide(`Known <b>${ex.correct}</b>`)}</div>
  <div class="deck"><div class="flash${ex.flipped?" flipped":""}" id="flash" onclick="flip()" role="button" aria-label="Flip card">
    <div class="face glass"><div class="side">${latinFirst?"German":"English"}</div>${front}${hintHTML(it)}<div class="hint">Tap to flip</div></div>
    <div class="face glass backside"><div class="side">${latinFirst?"English":"German"}</div>${backFace}<div class="hint">Did you know it?</div></div>
  </div></div>
  <div class="rate${ex.flipped?"":" wait"}"><button class="no" onclick="rate(false)">Still learning</button><button class="yes" onclick="rate(true)">I knew it</button></div>`;
  const f=document.getElementById("flash");let x0=null;
  f.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
  f.addEventListener("touchend",e=>{if(x0===null||!ex.flipped)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>70)rate(dx>0);});
}
function flip(){ if(!ex||ex.flipped)return; ex.flipped=true; document.getElementById("flash").classList.add("flipped"); document.querySelector(".rate").classList.remove("wait"); }
function rate(ok){ if(!ex||!ex.flipped||ex.rating)return; ex.rating=true; record(ex.q[ex.i],ok); ex.rating=false; nextQ(); }

/* ================= MATCH ================= */
function buildBoards(){
  const q=ex.q.slice(); ex.boards=[];
  while(q.length){const b=[],ens=new Set(),las=new Set();
    for(let k=0;k<q.length&&b.length<6;){const it=q[k];if(ens.has(it.en)||las.has(it.la)){k++;continue;}b.push(it);ens.add(it.en);las.add(it.la);q.splice(k,1);}
    ex.boards.push(b);}
  ex.b=0; ex.mist=new Set(); dealBoard();
}
function dealBoard(){const b=ex.boards[ex.b];ex.tiles=shuffle([...b.map(it=>({it,kind:"la",txt:UP(it.la)})),...b.map(it=>({it,kind:"en",txt:it.en.split(", ").slice(0,2).join(", ")}))]);ex.sel=null;ex.gone=new Set();ex.bad=null;}
function tapTile(k){
  if(!ex||ex.bad||ex.gone.has(k))return; const t=ex.tiles[k];
  if(ex.sel===null||ex.tiles[ex.sel].kind===t.kind){ex.sel=ex.sel===k?null:k;return render();}
  const s=ex.tiles[ex.sel];
  if(s.it.id===t.it.id){ex.gone.add(k);ex.gone.add(ex.sel);ex.sel=null;ex.i++;record(t.it,!ex.mist.has(t.it.id));
    if(ex.gone.size===ex.tiles.length){ex.b++;if(ex.b>=ex.boards.length)return finish();setTimeout(()=>{if(!ex||screen!=="match")return;dealBoard();render();},250);}
    return render();}
  ex.mist.add(s.it.id);ex.mist.add(t.it.id);ex.pen++;ex.bad=[ex.sel,k];render();
  setTimeout(()=>{if(!ex)return;ex.bad=null;ex.sel=null;if(screen==="match")render();},450);
}
function matchScreen(){
  app.innerHTML=`${runTop(false,ex.i,ex.q.length)}
  <div class="meta"><span>Board <b>${Math.min(ex.b+1,ex.boards.length)}</b> of ${ex.boards.length}</span><span>${ex.pen?`+${ex.pen} s`:""}</span>${rightSide("")}</div>
  <div class="board">${ex.tiles.map((t,k)=>{let c="";if(ex.gone.has(k))c=" gone";else if(ex.bad&&ex.bad.includes(k))c=" bad";else if(ex.sel===k)c=" sel";
    return `<button class="mt-tile glass ${t.kind}${c}" onclick="tapTile(${k})">${esc(t.txt)}</button>`;}).join("")}</div>`;
}

/* ================= DEFEND THE WALL ================= */
function wallScreen(){
  app.innerHTML=`<div class="top">${circle(IC.close,"finish()","Finish")}
    <div class="lives" id="lives">${[0,1,2].map(()=>`<span class="brick"></span>`).join("")}</div>
    <span class="clock" id="wscore">0</span></div>
  <div class="field-wall glass" id="field"><div class="lvl wlvl" id="lvl">Level 1</div><div class="wallbase"></div></div>
  <input id="wallin" class="wallin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type the English meaning">`;
  const inp=document.getElementById("wallin");
  inp.addEventListener("input",()=>wallTry(inp));
  inp.addEventListener("focus",()=>{fitWall();setTimeout(fitWall,350);});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(!wallTry(inp))inp.value="";}});
  setTimeout(()=>{try{inp.focus()}catch(e){}},50);
  fitWall(); if(!wallFitOn&&window.visualViewport){wallFitOn=true;visualViewport.addEventListener("resize",fitWall);visualViewport.addEventListener("scroll",fitWall);}
  if(!ex.w){ex.w={act:[],last:performance.now(),next:0,lives:3,level:1,hits:0,qi:0,run:true};requestAnimationFrame(wallLoop);}
}
/* Falling words keep the notes that change the meaning, shortened: cum (+ abl.), in (+ acc.) */
const CASES={accusative:"acc.",ablative:"abl.",dative:"dat.",genitive:"gen.",subjunctive:"subj.",indicative:"ind.",superlative:"superl."};
function foeHTML(la){const notes=(la.match(/\((\+[^)]*|\d)\)/g)||[]).map(n=>n.replace(/\+ ?(\w+)\.?/,(m,w)=>"+ "+(CASES[w]||w+".")));
  return esc(UP(la.replace(/\s*\([^)]*\)/g,"").trim()))+(notes.length?` <small>${esc(notes.join(" "))}</small>`:"");}
/* When the keyboard opens, shrink the play area so falling words stay in view above it */
let wallFitOn=false;
/* Phones can't always tell a web page that the keyboard is open, so the game assumes it is:
   the field, the answer box and the lives all fit in the top 55% of the screen, the part a keyboard never covers. */
/* In the phone app the page itself shrinks to the space above the keyboard, so the whole visible height is free to use */
function fitWall(){if(screen!=="wall")return;const f=document.getElementById("field");if(!f)return;
  const vv=window.visualViewport?visualViewport.height:innerHeight, room=NATIVE?vv:Math.min(innerHeight*0.55,vv), top=f.getBoundingClientRect().top+(window.scrollY||0);
  f.style.height=Math.max(140,room-top-72)+"px";window.scrollTo(0,0);}
function wallLoop(t){
  if(!ex||ex.mode!=="wall"||!ex.w||!ex.w.run)return;
  if(screen!=="wall"){ex.w.last=t;return requestAnimationFrame(wallLoop);}
  const w=ex.w, f=document.getElementById("field"); if(!f)return requestAnimationFrame(wallLoop);
  const H=f.clientHeight-70, dt=Math.min(.1,(t-w.last)/1000); w.last=t;
  if(w.H&&Math.abs(w.H-H)>2){const r=H/w.H;for(const a of w.act){a.y*=r;a.v*=r;}} w.H=H; /* keep words in step when the field resizes */
  const dur=Math.max(4.5,13/Math.pow(1.15,w.level-1)), gap=Math.max(1.1,3.2-(w.level-1)*.3);
  if(t>=w.next&&w.act.length<5){
    if(w.qi>0&&w.qi%ex.q.length===0)shuffle(ex.q);
    const it=ex.q[w.qi%ex.q.length]; w.qi++;
    const el=document.createElement("div"); el.className="foe"; el.innerHTML=foeHTML(it.la); f.appendChild(el);
    const x=8+Math.random()*Math.max(0,f.clientWidth-el.offsetWidth-16);
    w.act.push({it,el,x,y:-44,v:(H+44)/dur}); w.next=t+gap*1000;
  }
  for(const a of [...w.act]){a.y+=a.v*dt;a.el.style.transform=`translate(${a.x}px,${a.y}px)`;
    if(a.y>=H){a.el.remove();w.act.splice(w.act.indexOf(a),1);w.lives--;ex.answered++;ex.wrong.push(a.it);logPractice();save();
      f.classList.remove("hurt");void f.offsetWidth;f.classList.add("hurt");
      document.querySelectorAll("#lives .brick").forEach((b,i)=>b.classList.toggle("lost",i>=w.lives));
      if(w.lives<=0){w.run=false;save();setTimeout(finish,700);return;}}}
  requestAnimationFrame(wallLoop);
}
function wallTry(inp){
  const w=ex&&ex.w; if(!w||!w.run)return false;
  const a=w.act.find(a=>enOK(inp.value,a.it)); if(!a)return false;
  inp.value=""; w.act.splice(w.act.indexOf(a),1); a.el.classList.add("hit"); setTimeout(()=>a.el.remove(),260);
  ex.correct++;ex.answered++;ex.right.push(a.it);earn(DEN.game);logPractice();save();w.hits++;
  if(w.hits%6===0){w.level++;const l=document.getElementById("lvl");if(l)l.textContent=`Level ${w.level}`;}
  const s=document.getElementById("wscore");if(s)s.textContent=ex.correct; return true;
}

/* If the phone keyboard is put away, return the page to the top so the question doesn't sit low on the screen */
document.addEventListener("focusout",e=>{if(e.target&&e.target.id==="ans"&&!(ex&&ex.mode==="wall"))setTimeout(()=>{const a=document.activeElement;if(!a||a===document.body)window.scrollTo(0,0);},120);});
/* keyboard shortcuts */
document.addEventListener("keydown",e=>{
  if(screen==="cards"){ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} else if(e.key==="ArrowRight")rate(true); else if(e.key==="ArrowLeft")rate(false); }
  else if(screen==="exercise"&&ex&&ex.fb&&e.key==="Enter"&&document.activeElement!==document.getElementById("ans")&&document.getElementById("nextbtn")){e.preventDefault();nextQ();}
  else if(screen==="exercise"&&ex&&qType()==="mc"){const k="12345".indexOf(e.key)>=0?"12345".indexOf(e.key):"abcde".indexOf(e.key.toLowerCase()); if(k>=0)pick(k);}
});

/* ================= RESULTS ================= */
function timeBoxes(e){
  if(e.mode==="wall") return `<div class="timebox"><div class="glass${e.newBest?" newbest":""}"><b>${e.correct}</b><span>${e.newBest?"New high score":"Words stopped"}</span></div>
    ${e.prevBest?`<div class="glass"><b>${e.prevBest.score}</b><span>${e.newBest?"Previous best":"High score"}</span></div>`:""}</div>`;
  if(!e.timed) return "";
  if(!e.complete) return `<p class="note" style="text-align:center">Time isn't recorded when you finish early.</p>`;
  return `<div class="timebox"><div class="glass${e.newBest?" newbest":""}"><b>${fmtTime(e.ms)}</b><span>${e.newBest?"New best time":"Your time"}</span></div>
    ${e.prevBest?`<div class="glass"><b>${fmtTime(e.prevBest.ms)}</b><span>${e.newBest?"Previous best":"Best time"}</span></div>`:""}</div>
    ${e.pen?`<p class="note" style="text-align:center">Includes ${e.pen} × ${e.penMs/1000} s for ${e.mode==="match"?"wrong matches":"wrong or skipped answers"}.</p>`:""}`;
}
/* New words: before a Step by step or exam-plan round with words never seen, offer Flashcards first */
let pendingEx=null, freshWords=[];
function newWordsGate(rep){const SEEN=S.seen[W]||{},ids=new Set();
  const src=ex.dyn?stepPhase().cands.slice().sort((a,b)=>(ex.pref[a.id]??1e9)-(ex.pref[b.id]??1e9)).slice(0,ex.q.length):ex.q;
  freshWords=src.filter(q=>{if(ids.has(q.id)||SEEN[q.id]||started(q))return false;ids.add(q.id);return true;});
  if(!freshWords.length)return false;pendingEx=ex;go("newwords",rep);return true;}
function newwords(){const n=freshWords.length,total=pendingEx.dyn?Math.min(pendingEx.q.length,stepPhase().cands.length):new Set(pendingEx.q.map(q=>q.id)).size;
  app.innerHTML=`<div class="top">${circle(IC.close,"pendingEx=null;go('home')","Close")}<span></span></div>
  <h1>New words</h1>
  <p class="sub">${n===total?`All ${n} words in this round are new to you.`:`${n} of the ${total} words in this round are new to you.`} Learn them in Flashcards first, then come back and test yourself.</p>
  <div class="card glass nwlist">${freshWords.slice(0,8).map(it=>`<div class="srow"><span class="la">${esc(UP(it.la))}</span><span class="en">${esc(it.en)}</span></div>`).join("")}
    ${n>8?`<div class="empty" style="padding:10px">and ${n-8} more</div>`:""}</div>
  <div class="dock"><div class="duo"><button class="secondary glass" onclick="testAnyway()">Test me anyway</button>
    <button class="primary" style="height:52px" onclick="learnFirst()">Flashcards first</button></div></div>`;}
function testAnyway(){const SEEN=S.seen[W]||(S.seen[W]={});freshWords.forEach(w=>SEEN[w.id]=1);save();ex=pendingEx;pendingEx=null;prepQuestion();go("exercise",true);}
function learnFirst(){const keep=pendingEx;ex=newEx("fc",freshWords.map(w=>{const x=Object.assign({},w);delete x._st;delete x._auto;delete x._fill;delete x._dir;return x;}),Object.assign(cfgNow(),{mode:"fc",dir:"le"}));
  ex.pending=keep;ex.learn=true;pendingEx=null;sumTab=null;go("cards",true);}
function testPending(){const p=ex.pending;ex=p;prepQuestion();sumTab=null;go("exercise",true);}
function cheer(pct){
  if(ex.mode!=="test"||ex.trial||ex.cfg.src||!ex.answered)return "";
  let left,goal,first=false;
  if(stepMode()){const P=stepPhase();if(!P)return "Superb! Every word in this set is at gold. On to the next 20.";
    left=P.total-P.done;goal=["","bronze tier 1","bronze","silver","gold"][P.l];first=P.l===1&&!P.done;}
  else{const all=poolAll();left=remaining(all);goal=RN[modeRank()].toLowerCase();
    if(!left)return `Superb! Every word here has its ${goal} medal. Time for the next step.`;}
  const praise=first?"Great start!":pct>=90?"Excellent!":pct>=70?"Great job!":pct>=40?"Good effort!":"Keep at it!";
  return `${praise} ${first?"Keep going to earn your first bronze medals.":`Only ${left} word${left>1?"s":""} to go for ${goal}.`}`;}
function fcAgain(onlyWrong){const uniq=a=>[...new Map(a.map(x=>[x.id,x])).values()],w=onlyWrong?uniq(ex.wrong):uniq(ex.q),keep=ex.pending,learn=ex.learn;
  ex=newEx("fc",shuffle(w.map(x=>{const y=Object.assign({},x);delete y._st;delete y._auto;delete y._fill;delete y._dir;return y;})),Object.assign(cfgNow(),{mode:"fc",dir:ex.cfg.dir||S.dir}));
  ex.pending=keep;ex.learn=learn;sumTab=null;go("cards",true);}
function summary(){
  const m=ex.mode, uniq=a=>[...new Map(a.map(x=>[x.id,x])).values()];
  const ups=ex.upList||[], lists={wrong:uniq(ex.wrong),right:uniq(ex.right),mastered:ups.map(u=>u.it)};
  const closer=uniq(ex.right).filter(x=>!ups.some(u=>u.it.id===x.id)&&rankOf(x)<3&&started(x)).length;
  const tabs=!["review","fc","deriv","match","wall"].includes(m)&&S.smart?["wrong","right","mastered"]:["wrong","right"];
  if(!sumTab) sumTab=lists.wrong.length?"wrong":"right";
  const L={wrong:m==="fc"?"Still learning":m==="wall"?"Got through":"To practise",right:m==="fc"?"Knew it":m==="wall"?"Stopped":m==="match"?"First try":"Correct",mastered:"New medals"};
  const list=lists[sumTab];
  const msg={wrong:m==="wall"?"Nothing got through.":"Nothing to practise. Every answer was right.",right:"None this time.",mastered:"No new medals this time."}[sumTab];
  const pct=ex.answered?Math.round(ex.correct/ex.answered*100):0;
  const row=it=>m==="deriv"?`<div class="srow"><span class="en" style="text-align:left;color:var(--ink)">${esc((it.ders||[it.der]).filter(Boolean).slice(0,3).join(", "))}</span><span class="la">${esc(UP(it.la))}</span></div>`
    :`<div class="srow"><span class="la">${esc(UP(it.la))}${it.form?`<small>${esc(it.form)}</small>`:""}</span><span class="en">${esc(it.en)}</span></div>`;
  app.innerHTML=`
  <div class="top">${circle(IC.close,"go('home')","Close")}<span></span></div>
  ${m==="wall"?`<div class="score"><div class="big">${ex.correct}</div><p>words stopped before the wall fell</p></div>`
   :`<div class="score"><div class="big">${ex.correct}<span>/${ex.answered}</span></div>
    <p>${ex.answered?`${pct}% ${m==="fc"?"known":m==="match"?"matched first time":"correct"}`:"Nothing answered"}${ex.mastered.length?`, ${ex.mastered.length} new gold word${ex.mastered.length>1?"s":""}`:""}</p>
    ${cheer(pct)?`<p class="closer">${cheer(pct)}</p>`:S.smart&&!["fc","deriv","review","match","wall"].includes(m)&&closer?`<p class="closer">${closer} word${closer>1?"s are":" is"} closer to ${closer>1?"their":"its"} next medal</p>`:""}</div>`}
  ${timeBoxes(ex)}
  ${m==="fc"&&lists.wrong.length&&lists.wrong.length<new Set(ex.q.map(x=>x.id)).size?`<button class="primary" style="width:100%;height:52px;margin:0 0 14px" onclick="fcAgain(true)">Go again with the ${lists.wrong.length} still learning</button>`:""}
  <div class="seg tabs">${tabs.map(t=>`<button class="${sumTab===t?"on":""}" onclick="sumTab='${t}';render()"><b>${lists[t].length}</b><small>${L[t]}</small></button>`).join("")}</div>
  <div style="height:14px"></div>
  ${sumTab==="mastered"&&ups.length?[4,3,2,1].map(n=>[n,`${RN[n]} · ${RQ[n]}`,uniq(ups.filter(u=>u.r===n).map(u=>u.it))])
     .filter(g=>g[2].length).map(([n,t,l])=>`<div class="ghead sthead s${n}">${t}</div><div class="card glass">${l.map(row).join("")}</div>`).join("")
   :`<div class="card glass">${list.length?list.map(row).join(""):`<div class="empty">${msg}</div>`}</div>`}
  <div class="dock"><div class="duo"><button class="secondary glass" onclick="go('home')">Done</button>
    ${ex.pending?`<button class="primary" style="height:52px" onclick="testPending()">Test me on these</button>`
    :`<button class="primary" style="height:52px" onclick="${m==="review"?"startReview()":ex.trial?`startTrial(${ex.trial})`:ex.cfg.src?`startSrc('${ex.cfg.src}')`:m==="fc"?"fcAgain(false)":"S.mode=ex.mode;startRound()"}">${m==="review"?"Review more":m==="fc"&&lists.wrong.length?"Go again: all":"Go again"}</button>`}</div></div>`;
}

/* ================= CONGRATULATIONS ================= */
function wreathSVG(){
  const cx=120,cy=112,r=92; let leaves="";
  const branch=(from,to,dir)=>{const n=12;for(let i=0;i<n;i++){
      const th=from+(to-from)*i/(n-1), rad=th*Math.PI/180, side=i%2?1:-1, rr=r+side*9;
      const x=cx+rr*Math.cos(rad), y=cy+rr*Math.sin(rad), rot=th+dir*side*28+(dir<0?180:0), sc=1-i*.035;
      leaves+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(6.5*sc).toFixed(1)}" ry="${(15*sc).toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="url(#lg)"/>`;}};
  branch(108,250,1); branch(72,-70,-1);
  const arc=(a0,a1)=>{const p=t=>[cx+r*Math.cos(t*Math.PI/180),cy+r*Math.sin(t*Math.PI/180)].map(v=>v.toFixed(1)).join(" ");return `M${p(a0)} A${r} ${r} 0 0 ${a1>a0?1:0} ${p(a1)}`;};
  const C=S.theme==="classic"?{a:"#E2CB8A",b:"#9A772C",stem:"#9A772C",tie:"#1C3557"}:{a:"#FFD978",b:"#D98E14",stem:"#D98E14",tie:"#C9801A"};
  return `<svg class="wreath" viewBox="0 0 240 230" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.a}"/><stop offset="1" stop-color="${C.b}"/></linearGradient></defs>
    <path d="${arc(105,252)}" stroke="${C.stem}" stroke-width="2.5" fill="none"/><path d="${arc(75,-72)}" stroke="${C.stem}" stroke-width="2.5" fill="none"/>${leaves}
    <path d="M104 212q16-10 32 0M120 205v16" stroke="${C.tie}" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const d=devicePixelRatio||1, W=innerWidth, H=innerHeight; c.width=W*d;c.height=H*d;const g=c.getContext("2d");g.scale(d,d);
  const cols=S.theme==="classic"?["#B08D3C","#D9BE76","#1C3557","#3E5A86","#FFFFFF","#C9A24E"]:["#F2B53A","#6B4EE6","#17A866","#FF8FA3","#7CC6FF"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*60,y:H*.32,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,
    s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){g.clearRect(0,0,W,H);for(const p of P){p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();}
    if(t-t0<3200)requestAnimationFrame(f);else c.remove();})(t0);
}

  const cfg=doneInfo.cfg, key=keyFor(cfg), total=poolAll().length;

  const bests=Object.entries(S.best).filter(([k])=>k.startsWith(key+"|")&&!k.endsWith("|hs")).map(([,v])=>v.ms);
  app.innerHTML=`
  <div class="top">${circle(IC.close,`closeDone('${cfg.mode}')`,"Close")}<span></span></div>
  <div class="hero"><div class="crown">${wreathSVG()}<h2>AUSGEZEICHNET!</h2></div>
    <div class="tag">${modeRank()?`Every word is at ${RN[modeRank()].toLowerCase()}`:"You've learnt every word"}</div>

function info(){
  app.innerHTML=`<div class="top">${circle(IC.back,"back()","Back")}<span></span></div>
  <h1>How it works</h1><div style="height:12px"></div>
  <div class="card glass pad info">
  <h3>Gradus German: Vocab Master</h3><p><i>Gradus</i> is Latin for a step. This app takes you through your German vocabulary step by step, from your first bronze medal to gold on every word on your list, until you're a German Vocab Master.</p>
  <h3>Five ways to practise</h3><ul class="ways">
    <li><b>Tester</b> checks what you know, and is the only way to earn medals.</li>
    <li><b>Flashcards</b> help you learn new words: flip each card and say whether you knew it.</li>

    <li><b>Defend the wall</b>: type the English meaning before each German word reaches your wall.</li>

  <h3>Bronze, silver, gold and platinum</h3><p>The type of question decides what you earn. Multiple choice earns <b>bronze</b>, in two tiers: first pick the English for the German, then pick the German for the English. Typing the English earns <b>silver</b>. Typing the German earns <b>gold</b>, and a word at gold is learnt. Nouns and irregular verbs can go on to <b>platinum</b> once every plural and verb part is at gold.</p>

  <h3>Your house</h3><p>Every medal builds your house. Bronze lays the stone foundations, silver raises the timber frame and gold puts on the roof. Platinum adds the window boxes and the weathervane.</p>
